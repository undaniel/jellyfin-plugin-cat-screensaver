targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Animated cats as a screensaver for the Jellyfin web interface"
description: >
  Fades the Jellyfin web UI to black after a configurable idle time and shows one or
  more original cats that walk, sit, groom, stretch and fall asleep. Any interaction
  wakes the UI. Requires the File Transformation plugin to inject the script into
  index.html.
category: "General"
owner: "Daniel Carrasco"
imageUrl: "https://raw.githubusercontent.com/undaniel/jellyfin-plugin-cat-screensaver/main/images/icon.png"
artifacts:
- "Jellyfin.Plugin.CatScreensaver.dll"
changelog: >
  First release: procedural cat art, five palettes, idle detection that respects video,
  music, hidden tabs and typing, per-browser opt-out, preview button, clock with
  anti burn-in, reduced motion, adaptive frame rate and File Transformation injection.
