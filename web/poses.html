<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Cat Screensaver - pose sheet</title>
    <style>
        body {
            margin: 0;
            padding: 28px;
            background: #0d1119;
            color: #e8edf5;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; }
        p { margin: 0 0 22px; color: #93a0b4; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .card {
            background: linear-gradient(160deg, #1b2230, #121722);
            border: 1px solid #2a3445;
            border-radius: 14px;
            padding: 10px 10px 8px;
        }
        canvas { width: 100%; display: block; border-radius: 8px; background: #0b0e15; }
        .label { margin-top: 6px; font-size: 12px; color: #aab6c8; display: flex; justify-content: space-between; }
        .pose { color: #f6d2a8; font-weight: 600; }
    </style>
</head>
<body>
<h1>Cat Screensaver - original procedural poses</h1>
<p>Orange palette, every baked frame. Sprite space: 128 x 96, floor at y = 88.</p>
<div class="grid" id="grid"></div>

<script type="module">
    import { drawPose, POSE_FRAMES, paletteFor } from './src/art.js';

    const grid = document.getElementById('grid');
    const palette = paletteFor('orange', 1);
    const poses = ['walk', 'run', 'idle', 'sit', 'groom', 'stretch', 'sleep'];

    for (const pose of poses) {
        for (let frame = 0; frame < POSE_FRAMES[pose]; frame += 1) {
            const card = document.createElement('div');
            card.className = 'card';

            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');
            ctx.scale(2, 2);
            drawPose(ctx, pose, frame, palette, frame);

            const label = document.createElement('div');
            label.className = 'label';
            label.innerHTML = `<span class="pose">${pose}</span><span>frame ${frame + 1} / ${POSE_FRAMES[pose]}</span>`;

            card.append(canvas, label);
            grid.appendChild(card);
        }
    }
</script>
</body>
</html>
